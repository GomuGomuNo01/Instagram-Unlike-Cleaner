name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version minimale prise en charge et version de développement.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Dépendances (versions figées)
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Chromium pour Playwright
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check backend scripts
      - name: Format
        run: ruff format --check backend scripts
      - name: Typage
        run: mypy
      - name: Tests (dont l'automatisation sur la fausse page des likes, réseau coupé)
        run: pytest
      - name: Audit des dépendances
        run: pip-audit --skip-editable

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances (versions figées)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typage
        run: npm run typecheck
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Compilation
        run: npm run build
      - name: Audit des dépendances
        run: npm run audit
