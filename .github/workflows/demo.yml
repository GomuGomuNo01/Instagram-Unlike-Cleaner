name: Démo en ligne

# Publie sur GitHub Pages la démo de l'interface : la vraie interface d'IUC, branchée sur une
# fausse API qui tourne dans le navigateur avec des likes fictifs (frontend/src/demo).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilation de la démo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances (versions figées)
        run: npm ci
      - name: Compilation
        run: npm run build:demo
      - name: Adresses profondes (GitHub Pages renvoie 404.html pour une route de l'interface)
        run: cp dist-demo/index.html dist-demo/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-demo

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
