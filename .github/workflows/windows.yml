name: Application Windows

# Construit l'application Windows en deux formats : l'installeur (IUC-Setup-<version>.exe)
# et la version portable (IUC-<version>-portable.zip, sans installation). PyInstaller,
# contrôle de démarrage, puis Inno Setup.
# - Tag v* : publication dans une nouvelle Release.
# - À la demande, avec release_tag : ajout ou remplacement des fichiers d'une Release existante.
# - À la demande, sans release_tag : fichiers téléchargeables comme artefact du workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release existante à compléter (par exemple v1.0.0) ; vide : artefact seul"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    name: Application Windows
    runs-on: windows-latest
    permissions:
      contents: write # publication dans la Release
    env:
      # Nom du tag (v1.2.0), ou v0.0.0-dev ; IUC_VERSION en retire le « v ».
      TAG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version
        shell: pwsh
        run: '"IUC_VERSION=$($env:TAG_VERSION.TrimStart(''v''))" >> $env:GITHUB_ENV'
      - name: Dépendances Python (versions figées)
        run: pip install -e ".[package]" -c constraints.txt
      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Application (PyInstaller)
        run: pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/IUC.spec

      - name: Contrôle de démarrage
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "iuc"
          $app = Start-Process build\dist\IUC\IUC.exe -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/ -TimeoutSec 5
              $ok = $page.StatusCode -eq 200 -and $page.Content -match 'name="iuc-token"'
              if ($ok) { break }
            } catch {}
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "IUC.exe n'a pas servi son interface." }
          "IUC.exe démarre et sert son interface."

      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\iuc.iss
      - name: Version portable (zip)
        shell: pwsh
        run: |
          Copy-Item packaging\LISEZMOI-portable.txt build\dist\IUC\LISEZMOI.txt
          Copy-Item LICENSE build\dist\IUC\LICENSE.txt
          Compress-Archive -Path build\dist\IUC -DestinationPath "build\installer\IUC-$env:IUC_VERSION-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: IUC-${{ env.IUC_VERSION }}-windows
          path: |
            build/installer/*.exe
            build/installer/*.zip

      - name: Nouvelle Release (tag)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem build\installer\*.exe, build\installer\*.zip).FullName `
            --title "IUC ${{ env.IUC_VERSION }}" --notes-file packaging\release-notes.md
      - name: Release existante (à la demande)
        if: github.ref_type != 'tag' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" (Get-ChildItem build\installer\*.exe, build\installer\*.zip).FullName --clobber
          gh release edit "${{ inputs.release_tag }}" --notes-file packaging\release-notes.md
