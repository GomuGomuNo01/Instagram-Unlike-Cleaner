[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iuc"
dynamic = ["version"]
description = "Nettoyage local et contrôlé des « J'aime » Instagram"
readme = "README.md"
requires-python = ">=3.11"
# Bornes larges ici ; les versions exactes, testées ensemble, sont figées dans constraints.txt.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlmodel>=0.0.22,<0.1",
    "sqlalchemy>=2.0,<3",
    "playwright>=1.49,<2",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<3",
    "pre-commit>=4.0,<5",
    "pip-audit>=2.7,<3",
]
# Application Windows installable (packaging/) : pip install -e ".[package]" -c constraints.txt
package = [
    "pyinstaller>=6.16,<7",
]

[project.scripts]
iuc = "app.cli:app"

[tool.hatch.version]
path = "backend/app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["browser: lance Chromium sans fenêtre, sur de fausses pages Instagram (plus lent)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend", "scripts"]
mypy_path = "backend"
plugins = ["pydantic.mypy"]
